apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: app02-kustomize-prod
  namespace: argocd
spec:
  project: default

  source:
    repoURL: git@github.com:tbthesam3/argocd-lab.git
    targetRevision: HEAD
    path: app02-kustomize/overlays/prod

  destination:
    server: https://kubernetes.default.svc
    namespace: prod

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
