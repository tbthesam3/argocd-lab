apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: app02-kustomize-dev
  namespace: argocd
spec:
  project: default

  source:
    repoURL: git@github.com:tbthesam3/argocd-lab.git
    targetRevision: HEAD
    path: app02-kustomize/overlays/dev/

  destination:
    server: https://kubernetes.default.svc
    namespace: dev

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
